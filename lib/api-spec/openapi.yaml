openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Car Rental Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: cars
    description: Car management
  - name: bookings
    description: Booking management
  - name: payments
    description: Payment operations
  - name: auth
    description: Authentication
  - name: admin
    description: Admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /cars:
    get:
      operationId: listCars
      tags: [cars]
      summary: List available cars
      parameters:
        - name: transmission
          in: query
          schema:
            type: string
            enum: [manual, automatic]
        - name: fuel_type
          in: query
          schema:
            type: string
            enum: [petrol, diesel, electric, hybrid]
        - name: seats
          in: query
          schema:
            type: integer
        - name: location
          in: query
          schema:
            type: string
        - name: min_price
          in: query
          schema:
            type: number
        - name: max_price
          in: query
          schema:
            type: number
        - name: available
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of cars
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Car"
    post:
      operationId: createCar
      tags: [cars, admin]
      summary: Create a new car (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCarInput"
      responses:
        "201":
          description: Car created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /cars/{id}:
    get:
      operationId: getCar
      tags: [cars]
      summary: Get a car by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Car details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "404":
          description: Car not found
    put:
      operationId: updateCar
      tags: [cars, admin]
      summary: Update a car (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCarInput"
      responses:
        "200":
          description: Car updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "404":
          description: Car not found
    delete:
      operationId: deleteCar
      tags: [cars, admin]
      summary: Delete a car (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Car deleted
        "404":
          description: Car not found

  /cars/{id}/availability:
    get:
      operationId: checkCarAvailability
      tags: [cars]
      summary: Check car availability for date range
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: pickup_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: return_date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Availability status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityStatus"

  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List bookings (user's own or all for admin)
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
        "401":
          description: Unauthorized
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a new booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingInput"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Bad request (invalid dates or car unavailable)
        "401":
          description: Unauthorized

  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get a booking by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Booking not found
    put:
      operationId: updateBookingStatus
      tags: [bookings, admin]
      summary: Update booking status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingStatusInput"
      responses:
        "200":
          description: Booking updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /payments/create-session:
    post:
      operationId: createPaymentSession
      tags: [payments]
      summary: Create a Stripe checkout session for a booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentSessionInput"
      responses:
        "200":
          description: Stripe session URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSessionResponse"
        "401":
          description: Unauthorized

  /payments/webhook:
    post:
      operationId: stripeWebhook
      tags: [payments]
      summary: Stripe webhook handler
      responses:
        "200":
          description: Webhook received

  /payments/{bookingId}:
    get:
      operationId: getPayment
      tags: [payments]
      summary: Get payment info for a booking
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Email already in use

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

  /upload/image:
    post:
      operationId: uploadImage
      tags: [admin]
      summary: Upload a car image to Cloudinary
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "200":
          description: Image uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Car:
      type: object
      properties:
        id:
          type: integer
        brand:
          type: string
        model:
          type: string
        year:
          type: integer
        pricePerDay:
          type: number
        transmission:
          type: string
          enum: [manual, automatic]
        fuelType:
          type: string
          enum: [petrol, diesel, electric, hybrid]
        seats:
          type: integer
        location:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        available:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - brand
        - model
        - year
        - pricePerDay
        - transmission
        - fuelType
        - seats
        - location
        - available
        - createdAt

    CreateCarInput:
      type: object
      properties:
        brand:
          type: string
        model:
          type: string
        year:
          type: integer
        pricePerDay:
          type: number
        transmission:
          type: string
          enum: [manual, automatic]
        fuelType:
          type: string
          enum: [petrol, diesel, electric, hybrid]
        seats:
          type: integer
        location:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        available:
          type: boolean
      required:
        - brand
        - model
        - year
        - pricePerDay
        - transmission
        - fuelType
        - seats
        - location

    UpdateCarInput:
      type: object
      properties:
        brand:
          type: string
        model:
          type: string
        year:
          type: integer
        pricePerDay:
          type: number
        transmission:
          type: string
          enum: [manual, automatic]
        fuelType:
          type: string
          enum: [petrol, diesel, electric, hybrid]
        seats:
          type: integer
        location:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        available:
          type: boolean

    AvailabilityStatus:
      type: object
      properties:
        available:
          type: boolean
        conflictingBookings:
          type: integer
      required:
        - available

    Booking:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        carId:
          type: integer
        car:
          $ref: "#/components/schemas/Car"
        pickupDate:
          type: string
          format: date
        returnDate:
          type: string
          format: date
        totalPrice:
          type: number
        status:
          type: string
          enum: [pending, confirmed, cancelled, completed]
        createdAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
      required:
        - id
        - userId
        - carId
        - pickupDate
        - returnDate
        - totalPrice
        - status
        - createdAt

    CreateBookingInput:
      type: object
      properties:
        carId:
          type: integer
        pickupDate:
          type: string
          format: date
        returnDate:
          type: string
          format: date
      required:
        - carId
        - pickupDate
        - returnDate

    UpdateBookingStatusInput:
      type: object
      properties:
        status:
          type: string
          enum: [pending, confirmed, cancelled, completed]
      required:
        - status

    Payment:
      type: object
      properties:
        id:
          type: integer
        bookingId:
          type: integer
        amount:
          type: number
        paymentStatus:
          type: string
          enum: [pending, paid, failed, refunded]
        stripeSessionId:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - bookingId
        - amount
        - paymentStatus
        - createdAt

    CreatePaymentSessionInput:
      type: object
      properties:
        bookingId:
          type: integer
      required:
        - bookingId

    PaymentSessionResponse:
      type: object
      properties:
        sessionUrl:
          type: string
        sessionId:
          type: string
      required:
        - sessionUrl
        - sessionId

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [user, admin]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - role
        - createdAt

    RegisterInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required:
        - email
        - password

    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        message:
          type: string
      required:
        - user

    UploadResponse:
      type: object
      properties:
        url:
          type: string
        publicId:
          type: string
      required:
        - url
